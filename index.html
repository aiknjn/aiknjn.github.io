<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#147a45"><link rel="manifest" href="manifest.webmanifest"><title>漢文暗記マスター</title>
<style>
:root{--g:#147a45;--g2:#e6f3e9;--o:#f47735;--bg:#f7f8f3;--ink:#20251f;--muted:#69736b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
header{background:var(--g);color:#fff;padding:16px 18px 13px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0002}
h1{font-size:19px;margin:0}.subtitle{font-size:12px;opacity:.88;margin-top:3px}
nav{display:flex;overflow:auto;gap:7px;padding:10px 12px;background:var(--bg);position:sticky;top:62px;z-index:4}
nav button,.btn{border:0;border-radius:12px;padding:10px 13px;background:#e5e9e2;color:var(--ink);font-weight:700;white-space:nowrap}
nav button.active,.primary{background:var(--g);color:white}
main{max-width:760px;margin:auto;padding:4px 13px 34px}.panel{background:#fff;border-radius:18px;padding:16px;margin:8px 0 13px;box-shadow:0 2px 10px #0000000b}
h2{font-size:17px;margin:2px 0 12px}.muted{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.big{font-size:42px;font-weight:800;text-align:center;padding:25px 5px 8px;min-height:95px}
.center{text-align:center}.reading{font-size:22px;color:var(--o);font-weight:800}.meaning{font-size:17px;margin-top:8px}
.answer{display:none;text-align:center;border-top:1px solid #eee;margin-top:12px;padding-top:14px}.answer.show{display:block}
.progress{height:7px;border-radius:9px;background:#e9eee8;overflow:hidden;margin:9px 0}.bar{height:100%;background:var(--o);width:0}
.option{display:block;width:100%;text-align:left;background:#fff;border:1px solid #dfe5dd;border-radius:12px;padding:13px;margin:8px 0;font-weight:650}
.option.correct{border:2px solid #18864c;background:#e8f6ec}.option.wrong{border:2px solid #d55;background:#fff0f0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}
.tile{border:1px solid #e2e6df;background:white;border-radius:13px;padding:11px;text-align:left}
.tile b{display:block;font-size:23px}.tile small{color:var(--muted)}
input,select{padding:11px;border:1px solid #d9dfd7;border-radius:10px;width:100%;font-size:16px;background:white}
.pageimg{width:100%;height:auto;border-radius:12px;display:block}
.stat{font-size:28px;font-weight:800;color:var(--g)}.hidden{display:none!important}
footer{text-align:center;color:#899088;font-size:11px;padding:16px}
</style></head><body>
<header><h1>漢文暗記マスター</h1><div class="subtitle">重要語句 139〜162ページ｜暗記・4択・苦手復習</div></header>
<nav>
<button class="active" data-tab="flash">暗記カード</button><button data-tab="quiz">4択テスト</button><button data-tab="review">苦手復習</button><button data-tab="words">語句一覧</button><button data-tab="photos">参考写真</button>
</nav>
<main>
<section id="flash">
 <div class="panel">
  <div class="row between muted"><span id="flashCount">1 / 1</span><span id="knownCount">覚えた 0語</span></div><div class="progress"><div class="bar" id="flashBar"></div></div>
  <div class="center muted" id="flashPage">139ページ</div><div class="big" id="flashWord"></div>
  <div class="center"><button class="btn primary" id="showAnswer">答えを見る</button></div>
  <div class="answer" id="flashAnswer"><div class="reading" id="flashReading"></div><div class="meaning" id="flashMeaning"></div>
   <div class="row center" style="justify-content:center;margin-top:14px"><button class="btn" id="markAgain">まだ不安</button><button class="btn primary" id="markKnown">覚えた！</button></div>
  </div>
  <div class="row" style="justify-content:center;margin-top:15px"><button class="btn" id="prev">← 前へ</button><button class="btn" id="next">次へ →</button><button class="btn" id="mix">シャッフル</button></div>
 </div><p class="muted">漢字を見て、読みと意味を思い出してから答えを確認。覚えた語句は「覚えた！」で記録されるよ。</p>
</section>
<section id="quiz" hidden>
 <div class="panel"><div class="row between muted"><span id="quizCount">1 / 10</span><span id="quizScore">正解 0</span></div><div class="progress"><div class="bar" id="quizBar"></div></div>
 <div class="center muted" id="quizPage"></div><div class="big" id="quizWord"></div><p class="center muted">正しい読みを選ぼう</p><div id="options"></div><div id="quizFeedback" class="center" style="font-weight:750;margin:10px"></div>
 <div class="row" style="justify-content:center"><button class="btn primary" id="quizNext" disabled>次の問題</button><button class="btn" id="newQuiz">テストをやり直す</button></div></div>
</section>
<section id="review" hidden>
 <div class="panel"><h2>苦手語句の復習</h2><p class="muted">「まだ不安」にした語句と、4択で間違えた語句がここに集まるよ。</p><div class="row between"><div><div class="stat" id="reviewNum">0</div><div class="muted">復習する語句</div></div><button class="btn primary" id="startReview">復習を始める</button></div></div>
 <div class="grid" id="reviewTiles"></div>
</section>
<section id="words" hidden>
 <div class="panel"><h2>語句一覧（全範囲）</h2><input id="search" placeholder="漢字・読み・意味・ページで検索"><div class="row" style="margin-top:9px"><select id="pageFilter"><option value="all">全ページ</option></select></div><p class="muted" id="wordCount"></p></div><div class="grid" id="tiles"></div>
</section>
<section id="photos" hidden><div class="panel"><h2>参考写真</h2><p class="muted">送ってくれた教科書写真を収録。細かい字や読みは原本でも確認してね。</p></div><div id="photoList"></div></section>
</main><footer>学習用の要約・読みの入力です。写真の細部が不鮮明な箇所は、教科書の表記を優先してね。</footer>
<script src="data.js"></script><script>
const cards=window.KANBUN_CARDS;let order=cards.map((_,i)=>i),pos=0,known=new Set(),weak=new Set(),quizSet=[],qi=0,score=0,answered=false;
const $=id=>document.getElementById(id);
function setTab(tab){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));['flash','quiz','review','words','photos'].forEach(id=>$(id).hidden=id!==tab);if(tab==='review')renderReview();if(tab==='words')renderTiles();if(tab==='flash')renderFlash()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function renderFlash(){let c=cards[order[pos]];$('flashCount').textContent=(pos+1)+' / '+order.length;$('flashBar').style.width=((pos+1)/order.length*100)+'%';$('knownCount').textContent='覚えた '+known.size+'語';$('flashPage').textContent=c.page+'ページ';$('flashWord').textContent=c.word;$('flashReading').textContent=c.reading;$('flashMeaning').textContent=c.meaning;$('flashAnswer').classList.remove('show')}
$('showAnswer').onclick=()=>$('flashAnswer').classList.add('show');
$('next').onclick=()=>{pos=(pos+1)%order.length;renderFlash()};$('prev').onclick=()=>{pos=(pos-1+order.length)%order.length;renderFlash()};
$('mix').onclick=()=>{order.sort(()=>Math.random()-.5);pos=0;renderFlash()};
$('markKnown').onclick=()=>{known.add(order[pos]);weak.delete(order[pos]);renderFlash();$('flashAnswer').classList.add('show')};
$('markAgain').onclick=()=>{weak.add(order[pos]);known.delete(order[pos]);renderFlash()};
function newQuiz(){quizSet=cards.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,10);qi=0;score=0;renderQuiz()}
function renderQuiz(){answered=false;$('quizNext').disabled=true;$('quizFeedback').textContent='';$('quizScore').textContent='正解 '+score;let idx=quizSet[qi],c=cards[idx];$('quizCount').textContent=(qi+1)+' / '+quizSet.length;$('quizBar').style.width=(qi/quizSet.length*100)+'%';$('quizPage').textContent=c.page+'ページ';$('quizWord').textContent=c.word;
 let opts=[c.reading];while(opts.length<4){let v=cards[Math.floor(Math.random()*cards.length)].reading;if(!opts.includes(v))opts.push(v)}opts.sort(()=>Math.random()-.5);$('options').innerHTML='';
 opts.forEach(v=>{let b=document.createElement('button');b.className='option';b.textContent=v;b.onclick=()=>choose(v,idx,b);$('options').appendChild(b)})}
function choose(v,idx,btn){if(answered)return;answered=true;let c=cards[idx],ok=v===c.reading;if(ok)score++;else weak.add(idx);[...$('options').children].forEach(b=>{if(b.textContent===c.reading)b.classList.add('correct');else if(b===btn)b.classList.add('wrong');b.disabled=true});$('quizFeedback').textContent=ok?'正解！ 🎉':'不正解：'+c.reading+'（'+c.meaning+'）';$('quizScore').textContent='正解 '+score;$('quizNext').disabled=false;$('quizNext').textContent=qi===quizSet.length-1?'結果を見る':'次の問題'}
$('quizNext').onclick=()=>{if(!answered)return;if(qi===quizSet.length-1){$('quizFeedback').textContent='10問中 '+score+'問正解！';$('quizNext').disabled=true;$('quizNext').textContent='終了';}else{qi++;renderQuiz()}};$('newQuiz').onclick=newQuiz;
function renderReview(){$('reviewNum').textContent=weak.size;$('reviewTiles').innerHTML='';[...weak].forEach(i=>{let c=cards[i],b=document.createElement('button');b.className='tile';b.innerHTML='<b></b><small></small>';b.querySelector('b').textContent=c.word;b.querySelector('small').textContent=c.reading+'｜'+c.page+'ページ';b.onclick=()=>{order=[i,...cards.map((_,j)=>j).filter(j=>j!==i)];pos=0;setTab('flash');$('flashAnswer').classList.add('show')};$('reviewTiles').appendChild(b)})}
$('startReview').onclick=()=>{if(!weak.size)return;order=[...weak];pos=0;setTab('flash')};
for(let p=139;p<=162;p++){let o=document.createElement('option');o.value=p;o.textContent=p+'ページ';$('pageFilter').appendChild(o)}
function renderTiles(){let q=$('search').value.trim(),p=$('pageFilter').value;let found=cards.map((c,i)=>({...c,i})).filter(c=>(p==='all'||c.page===+p)&&[c.word,c.reading,c.meaning,c.page].join(' ').includes(q));$('wordCount').textContent=found.length+'語';$('tiles').innerHTML='';found.forEach(c=>{let b=document.createElement('button');b.className='tile';b.innerHTML='<b></b><small></small>';b.querySelector('b').textContent=c.word;b.querySelector('small').textContent=c.reading+'｜'+c.page+'ページ';b.onclick=()=>{order=[c.i,...cards.map((_,i)=>i).filter(i=>i!==c.i)];pos=0;setTab('flash');$('flashAnswer').classList.add('show')};$('tiles').appendChild(b)})}
$('search').oninput=renderTiles;$('pageFilter').onchange=renderTiles;
const imgs=Array.from({length:13},(_,i)=>2002+i);$('photoList').innerHTML=imgs.map((n,i)=>`<div class="panel"><p><b>資料 ${i+1}</b></p><a href="images/page_${n}.jpg" target="_blank"><img class="pageimg" loading="lazy" src="images/page_${n}.jpg" alt="教科書写真"></a></div>`).join('');
newQuiz();renderFlash();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js');
</script></body></html>
